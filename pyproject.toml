[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "tpehg-preterm-ml"
version = "4.0.0"
description = "Companion code: Analysis of Electrohysterogram Signals and Prediction of Preterm Births using Machine Learning"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "scikit-learn>=1.4,<2", "scipy>=1.11,<2", "xgboost>=2.0,<4", "matplotlib>=3.8,<4", "joblib>=1.3,<2", "tabulate>=0.9,<1", "imbalanced-learn>=0.13,<1"]
[project.optional-dependencies]
deep = ["torch>=2.1,<3"]
test = ["pytest>=8,<10"]
[project.scripts]
tpehg = "tpehg.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
